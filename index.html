<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Sederhana - Tangerang Selatan</title>
    <!-- Memuat Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }
        /* Peta akan mengisi seluruh layar */
        #map {
            width: 100vw;
            height: 100vh;
        }
        .leaflet-popup-content {
            font-size: 14px;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .popup-table th, .popup-table td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
        }
        .popup-table th {
            background-color: #f2f2f2;
            width: 40%;
        }
    </style>
</head>
<body>

<!-- Kontainer Peta -->
<div id="map"></div>

<!-- Memuat Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    // 1. Inisialisasi peta
    // Koordinat pusat rata-rata Tangerang Selatan (-6.2886, 106.7179) dengan zoom level 12
    const map = L.map('map').setView([-6.2886, 106.7179], 12);

    // 2. Tambahkan basemap OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 3. Fungsi Asynchronous untuk memuat dan menampilkan data GeoJSON
    async function loadGeoJSON() {
        try {
            // Mengambil file dari folder "data/"
            const response = await fetch('data/tangsel.geojson');
            
            if (!response.ok) {
                throw new Error('Gagal memuat file GeoJSON. Pastikan file "data/tangsel.geojson" tersedia.');
            }
            
            const data = await response.json();

            // 4. Tambahkan layer GeoJSON ke peta
            L.geoJSON(data, {
                onEachFeature: function (feature, layer) {
                    // 5. Tambahkan popup untuk setiap fitur di peta
                    // Mengambil semua properties/atribut yang ada untuk ditampilkan di tabel
                    if (feature.properties) {
                        let popupContent = '<b>Informasi Atribut</b><br>';
                        popupContent += '<div style="max-height: 200px; overflow-y: auto;">';
                        popupContent += '<table class="popup-table">';
                        
                        // Iterasi semua key dan value dari dalam properties
                        for (const key in feature.properties) {
                            popupContent += `<tr><th>${key}</th><td>${feature.properties[key]}</td></tr>`;
                        }
                        
                        popupContent += '</table></div>';
                        layer.bindPopup(popupContent);
                    }
                }
            }).addTo(map);
            
        } catch (error) {
            console.error('Error:', error);
            console.warn("Catatan: Untuk menggunakan Fetch API pada file lokal, Anda mungkin harus membuka file ini menggunakan Web Server lokal (misal: Live Server di VSCode atau Python HTTP server).");
        }
    }

    // Panggil fungsi untuk meload GeoJSON saat halaman dibuka
    loadGeoJSON();
</script>

</body>
</html>
